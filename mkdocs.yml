site_name: Swift / iOS Mobile Engineering Handbook
site_description: Handbook Swift/iOS bằng tiếng Việt — từ Foundation đến Production, Mobile System Design và Global Interview.
site_url: https://imindesign96.github.io/Swift-iOS-Mobile-Engineering-Handbook/
repo_url: https://github.com/imindesign96/Swift-iOS-Mobile-Engineering-Handbook
repo_name: imindesign96/Swift-iOS-Mobile-Engineering-Handbook
docs_dir: .site-docs
site_dir: site

theme:
  name: material
  language: vi
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - vi
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - assets/stylesheets/extra.css

